name: Showreel
description: Record a cinematic MP4 demo video of your web app from a short YAML script.
author: Showreel contributors
branding:
  icon: film
  color: purple
inputs:
  script:
    description: Path to the Showreel script (YAML), relative to the repository root.
    required: true
  output:
    description: Where to write the MP4 (default out/<script name>.mp4).
    required: false
    default: ''
  preset:
    description: Override the script's preset (studio, daylight, bare, vertical, square).
    required: false
    default: ''
  gif:
    description: Also write a GIF ("true" or "false").
    required: false
    default: 'false'
  allow-remote:
    description: Allow non-local URLs ("true" or "false").
    required: false
    default: 'false'
  upload:
    description: Upload the video and its contact sheet as a workflow artifact ("true" or "false").
    required: false
    default: 'true'
  artifact-name:
    description: Name of the uploaded artifact.
    required: false
    default: showreel
  node-version:
    description: Node.js version to run Showreel with.
    required: false
    default: '22'
outputs:
  video:
    description: Path of the MP4.
    value: ${{ steps.render.outputs.video }}
  sheet:
    description: Path of the contact sheet PNG.
    value: ${{ steps.render.outputs.sheet }}
  gif:
    description: Path of the GIF, when asked for.
    value: ${{ steps.render.outputs.gif }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
    - name: Install Showreel
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --no-audit --no-fund && npm run build
    - name: Install Chromium and ffmpeg
      shell: bash
      run: |
        node "$GITHUB_ACTION_PATH/dist/cli.js" setup --with-deps
        command -v ffmpeg >/dev/null || { sudo apt-get update -q && sudo apt-get install -yq ffmpeg; }
    - name: Render
      id: render
      shell: bash
      env:
        RENDER_SCRIPT: ${{ inputs.script }}
        RENDER_OUTPUT: ${{ inputs.output }}
        RENDER_PRESET: ${{ inputs.preset }}
        RENDER_GIF: ${{ inputs.gif }}
        RENDER_ALLOW_REMOTE: ${{ inputs.allow-remote }}
      run: bash "$GITHUB_ACTION_PATH/action/render.sh"
    - name: Upload
      if: always() && inputs.upload == 'true' && steps.render.outputs.video != ''
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ steps.render.outputs.video }}
          ${{ steps.render.outputs.sheet }}
          ${{ steps.render.outputs.gif }}
        if-no-files-found: error
