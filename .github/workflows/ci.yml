name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update -q && sudo apt-get install -yq ffmpeg
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  action:
    # Dogfood: the action in this repository renders the hero script.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          script: examples/hero.yml
          artifact-name: hero
  fresh-install:
    # The README Quickstart, exactly as written, in a clean container.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: ./scripts/fresh-install.sh
