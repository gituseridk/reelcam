# Gallery: Excalidraw (MIT, excalidraw.com), built and served locally by build.sh.
# One idea: a three-step plan sketched in seconds (tools by keyboard: R, A, D, O).
serve: site
viewport: { width: 1280, height: 720 }
setup:
  - click: { at: [0.29, 0.42] }   # gives the app keyboard focus
  - press: r
  - hover: { at: [0.29, 0.42] }   # the pen waits where the first stroke starts
steps:
  - focus: { area: [0.27, 0.36, 0.83, 0.66], why: "every stroke happens here" }
  - drag: { from: [0.29, 0.42], to: [0.40, 0.60], ms: 330 }
  - press: Enter
  - type: { text: "Idea", delay: 55 }
  - press: Escape
  - press: a
  - drag: { from: [0.41, 0.51], to: [0.465, 0.51], ms: 260 }
  - press: d
  - drag: { from: [0.475, 0.39], to: [0.60, 0.63], ms: 330 }
  - press: Enter
  - type: { text: "Test", delay: 55 }
  - press: Escape
  - press: a
  - drag: { from: [0.61, 0.51], to: [0.665, 0.51], ms: 260 }
  - press: o
  - drag: { from: [0.675, 0.41], to: [0.81, 0.61], ms: 330 }
  - press: Enter
  - type: { text: "Ship", delay: 55 }
  - press: Escape
  - click: { at: [0.74, 0.66] }   # click away: nothing stays selected
  - caption: { text: "Excalidraw, filmed by a 28-line script", ms: 1300 }
