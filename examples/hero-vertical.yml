# The hero story as a 9:16 phone video.
serve: orbit
viewport: { width: 390, height: 844 }
scale: 3
preset: vertical
steps:
  - wait: 200
  - click: "#search"
  - focus: { on: "#palette", why: "the typing happens inside the palette" }
  - type: { text: "ship 2.0", delay: 75 }
  - wait: 700
  - press: Enter
  - wide: "the checks tick, the ring fills, it goes live"
  - wait: 3300
  - caption: Recorded from 15 lines of YAML
  - wait: 2300
